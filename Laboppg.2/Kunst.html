<!DOCTYPE html>
<html>

<body>
    <canvas id="myCanvas" width="600" height="600" style="border:1px solid rgb(0, 0, 0)"></canvas>
    <script>
        const canvas = document.getElementById("myCanvas");
        const ctx = canvas.getContext("2d");
        //Tabel
        let tabel = [];
            let r = 300;
            let antall = 16;
            let dv = 2 * Math.PI / antall;
            let v = 0;
            for (i = 0; i < antall; i++) {
                xm = r * Math.cos(v) + 300;
                ym = r * Math.sin(v) + 300;
                tabel[i] = { x: xm, y: ym };
                v += dv;
            }
        function draw() {
            ctx.fillStyle = "cyan";
            ctx.fillRect(0, 0, 600, 600);
            ctx.beginPath()
            for (i = 0; i < antall; i++) {
                ctx.lineTo(tabel[i].x,tabel[i].y)
            }
            ctx.closePath();
            ctx.stroke();
        }
        draw();
    </script>
</body>
</html>
