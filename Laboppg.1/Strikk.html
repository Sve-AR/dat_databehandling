<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moving2.Oving2</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #777;
            font-family: Arial, sans-serif;
        }

        /* Fake old Windows-style window */
        .window {
            width: 400px;
            height: 400px;
            margin: 5px;
            border: 2px solid #aaa;
            background: yellow;
        }

        /* Title bar */
        .title-bar {
            height: 20px;
            background: #000080;
            color: white;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            padding-left: 5px;
        }

        .title {
            flex: 1;
        }

        /* Window buttons */
        .buttons {
            display: flex;
            height: 16px;
        }

        .button {
            width: 16px;
            height: 14px;
            margin-right: 2px;
            background: #c0c0c0;
            color: black;
            border: 1px solid white;
            border-right-color: #555;
            border-bottom-color: #555;
            font-size: 11px;
            line-height: 11px;
            text-align: center;
            font-weight: bold;
        }

        /* Yellow drawing area */
        .canvas-area {
            position: relative;
            height: calc(100% - 20px);
            background: #ffff00;
        }

        /* Red rectangle */
        .red-box {
            position: absolute;
            width: 197px;
            height: 187px;
            left: 99px;
            top: 93px;
            background: #ff0000;
        }

        /* Horizontal line */
        .line {
            position: absolute;
            left: 0;
            top: 94px;
            width: 100%;
            height: 1px;
            background: #000;
        }

        /* Small circle in the middle */
        .circle {
            position: absolute;
            width: 7px;
            height: 7px;
            left: 50%;
            top: 90px;
            transform: translateX(-50%);
            border: 1px solid #000;
            border-radius: 50%;
            background: #ff0000;
        }
    </style>
</head>

<body>

    <div class="window">

        <div class="title-bar">
            <div class="title">⚙ Moving2.Oving2</div>

            <div class="buttons">
                <div class="button">−</div>
                <div class="button">□</div>
                <div class="button">×</div>
            </div>
        </div>

        <div class="canvas-area">

            <div class="red-box">
                <div class="line"></div>
                <div class="circle"></div>
            </div>

        </div>

    </div>

</body>
</html>
