<!DOCTYPE html>
<html>
<body>
<h1>Mikey Mouse Clubhouse  </h1>

<canvas id="myCanvas" width="600" height="600" style="border:1px solid rgb(255, 255, 255)"></canvas>

<script>
const c = document.getElementById("myCanvas");
const ctx = c.getContext("2d");

//Sky
ctx.fillStyle = "cyan";
ctx.fillRect(0,0,600,600);
//Mountains
ctx.fillStyle = "white";
ctx.beginPath();
ctx.moveTo(0, 30);
ctx.lineTo(50, 70);
ctx.lineTo(500, 150);
ctx.lineTo(600, 50);
ctx.stroke();
//House Base
ctx.beginPath();
ctx.fillStyle = "red";
ctx.fillRect(150, 300, 300, 150);
ctx.fill();
//Grass
ctx.fillStyle = "green";
ctx.fillRect(0,450,600,600)
//Roof
ctx.fillStyle = "black";
ctx.beginPath();
ctx.arc(300, 300, 149, Math.PI, 2*Math.PI);
ctx.closePath();
ctx.fill();
//Ears
ctx.beginPath();
ctx.arc(200, 200, 100, 0, 2*Math.PI);
ctx.fillStyle = "black";
ctx.fill();
ctx.closePath();
ctx.stroke();
ctx.beginPath();
ctx.arc(400, 200, 100, 0, 2*Math.PI);
ctx.fillStyle = "black";
ctx.fill();
ctx.closePath();
ctx.stroke();
//Door
ctx.fillRect(275,400,50,50);
ctx.fill();
//Windows
ctx.fillStyle = "yellow";
ctx.fillRect(375,350,35,35);
ctx.fillStyle = "yellow";
ctx.fillRect(200,350,35,35)
ctx.stroke();
</script> 
<h3>
    - Sverre Ryeng
</h3>
</body>
</html>
